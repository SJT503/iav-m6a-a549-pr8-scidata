# ============================================================================
# IAV m6A A549 PR8 — analysis configuration
#
# Every script in scripts/ reads its paths, sample list and analysis settings
# from this one file. Nothing else in the workflow hard-codes a path.
#
# Workflow:
#   1. Put the files downloaded from GEO (GSE336465) into `raw/`, `processed/`
#      and `qc_evidence/` under the data root, as described in README.md.
#   2. Edit `data_root` below if your layout differs from the default.
#   3. Run the scripts in the order given in README.md.
#
# Values may be followed by a comment introduced by "  #".
# ============================================================================

[paths]
# Root of the input data. A relative path is resolved against the repository
# root; an absolute path is used as given.
data_root = data

# The six Feature Extraction .txt files and Matrix.xlsx.
raw_dir = raw

# The eight provider result .xlsx tables.
processed_dir = processed

# Provider quality-control reports shipped with this repository.
qc_dir = qc_evidence

# Caches written by 00_prepare_inputs.py (regenerated, not distributed).
interim_dir = interim

# Output directories, relative to the repository root.
results_dir = results
figdata_dir = figdata
figures_dir = figures
tables_dir = tables

[samples]
# Order matters: MOCK_1..3 must precede PR8_1..3 in every design matrix.
names = MOCK_1, MOCK_2, MOCK_3, PR8_1, PR8_2, PR8_3
groups = MOCK, MOCK, MOCK, PR8, PR8, PR8

# Reference and case level of the limma comparison (coefficient 2 tests case vs reference).
reference = MOCK
case = PR8

[geo]
series = GSE336465
platform = GPL25759
gsm = GSM9835854, GSM9835855, GSM9835856, GSM9835857, GSM9835858, GSM9835859

[analysis]
# Significance thresholds used throughout the manuscript.
# FDR cutoff for the Benjamini-Hochberg adjusted P value.
fdr_cut = 0.05
# Expression: at least two-fold change.
log2fc_cut = 1.0
# %modified: at least 5 percentage points.
pctmod_pp_cut = 5.0
# "Nearly unchanged" expression.
log2fc_flat = 0.5
# "Changed %modified" among flat-expression transcripts.
pctmod_pp_flat = 10.0
# Highly variable probes for the quality figures.
n_variable_genes = 2000

[input_files]
# Names exactly as deposited in GEO; change only if the GEO record is renamed.
matrix = Matrix.xlsx
fe_files = MOCK_1.txt, MOCK_2.txt, MOCK_3.txt, PR8_1.txt, PR8_2.txt, PR8_3.txt
mrna_q_flagpass = mRNA_Quantity(flag_pass).xlsx
mrna_expr_flagpass = mRNA_ExpressionLevel(flag_pass).xlsx
lncrna_q_flagpass = lncRNA_Quantity(flag_pass).xlsx
others_q_flagpass = others_Quantity(flag_pass).xlsx
mrna_q_diffmeth = mRNA_Quantity(diffmethylated).xlsx
lncrna_q_diffmeth = lncRNA_Quantity(diffmethylated).xlsx
others_q_diffmeth = others_Quantity(diffmethylated).xlsx
mrna_expr_diffexp = mRNA_ExpressionLevel(diffexpressed).xlsx

[qc_files]
# Provider quality-control reports shipped with this repository (not part of the
# GEO deposit). Needed for Figure 2a and Table 2.
nanodrop = RNA_QC_nanoDrop_quantification.csv
spikein = MeRIP_QC_spikein_pct_input.csv
labeling = Agilent Labeling Report.pdf
gel_image = RNA_QC_gel_image_original.jpeg
